<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#222"/></marker></defs><style>text{font:16px Arial;fill:#111}.s{fill:white;stroke:#222;stroke-width:2}.e{stroke:#222;stroke-width:2;fill:none;marker-end:url(#a)}</style><text x="25" y="25" font-weight="bold">A = ASCII letter, D = digit; unspecified transitions go to trap state qD</text><path class="e" d="M25 110H70"/><g><circle class="s" cx="110" cy="110" r="30"/><circle class="s" cx="280" cy="110" r="30"/><circle class="s" cx="450" cy="110" r="30"/><circle class="s" cx="620" cy="110" r="30"/><circle class="s" cx="800" cy="110" r="30"/><circle cx="800" cy="110" r="24" fill="none" stroke="#222"/></g><g text-anchor="middle"><text x="110" y="116">q0</text><text x="280" y="116">q1</text><text x="450" y="116">q2</text><text x="620" y="116">q3</text><text x="800" y="116">q4*</text></g><g class="e"><path d="M140 110H250"/><path d="M310 110H420"/><path d="M480 110H590"/><path d="M650 110H770"/><path d="M265 80C220 30 340 30 295 80"/><path d="M435 80C390 30 510 30 465 80"/><path d="M770 80C730 25 870 25 830 80"/></g><g text-anchor="middle"><text x="195" y="98">A/D</text><text x="365" y="98">@</text><text x="535" y="98">.</text><text x="710" y="98">A</text><text x="280" y="45">A/D loop</text><text x="450" y="45">A/D loop</text><text x="800" y="40">A loop</text></g><text x="460" y="190" text-anchor="middle">q1 = local part; q2 = domain; q3 = first TLD letter; q4 = at least two TLD letters</text><text x="460" y="216" text-anchor="middle">Accept at end of input only in q4. Pattern: [A-Za-z0-9]+@[A-Za-z0-9]+\.[A-Za-z]{2,}</text></svg>