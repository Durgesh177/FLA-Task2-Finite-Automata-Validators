<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#222"/></marker></defs><style>text{font:16px Arial;fill:#111}.s{fill:white;stroke:#222;stroke-width:2}.e{stroke:#222;stroke-width:2;fill:none;marker-end:url(#a)}</style><text x="25" y="28" font-weight="bold">Conceptual view of product DFA: bounded length counter + four class-seen flags</text><path class="e" d="M30 125H90"/><circle class="s" cx="130" cy="125" r="32"/><rect class="s" x="250" y="80" width="300" height="90" rx="14"/><circle class="s" cx="700" cy="125" r="42"/><circle cx="700" cy="125" r="35" fill="none" stroke="#222"/><circle class="s" cx="420" cy="220" r="25"/><g text-anchor="middle"><text x="130" y="131">Start</text><text x="400" y="111">State (n, U, L, D, S)</text><text x="400" y="139">n = 0…16; flags record classes</text><text x="700" y="131">Accept</text><text x="420" y="226">qD</text></g><path class="e" d="M162 125H250"/><path class="e" d="M550 125H655"/><path class="e" d="M400 170V195"/><path class="e" d="M430 80C470 25 520 25 530 80"/><g text-anchor="middle"><text x="205" y="112">U/L/D/S</text><text x="603" y="112">end: n 8–16,</text><text x="603" y="132">all flags true</text><text x="465" y="54">update counter/flag</text><text x="445" y="190">invalid char or &gt;16</text></g><text x="460" y="252" text-anchor="middle">qD is a trap state; any further input remains rejected</text></svg>